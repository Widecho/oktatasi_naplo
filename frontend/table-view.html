<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <title>Táblázatos napló nézet</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page-actions">
    <a href="index.html"><button type="button">Vissza a naplóhoz</button></a>
    <button type="button" onclick="window.print()">Nyomtatás</button>
  </div>

  <h1>Táblázatos napló nézet</h1>
  <p id="tableSummary"></p>

  <div class="table-wrapper">
    <table class="entries-table">
      <thead>
        <tr>
          <th>Dátum</th>
          <th>Óra</th>
          <th>Műszak</th>
          <th>Oktatás típusa</th>
          <th>Időtartam</th>
          <th>Oktató</th>
          <th>Téma</th>
          <th>Vázlat</th>
          <th>Kitöltötte</th>
        </tr>
      </thead>
      <tbody id="entriesTableBody"></tbody>
    </table>
  </div>

  <p id="tableMessage"></p>

  <script src="table-view.js"></script>
</body>

</html>
