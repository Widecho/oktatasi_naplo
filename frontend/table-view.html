<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <title>Táblázatos napló nézet</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page-actions">
    <a href="index.html"><button type="button">Vissza a naplóhoz</button></a>
    <button type="button" onclick="window.print()">Nyomtatás</button>
  </div>

  <h1>Táblázatos napló nézet</h1>
  <p id="tableSummary"></p>

  <div class="table-tools">
    <label for="tableSearch"><strong>Keresés:</strong></label>
    <input type="search" id="tableSearch" placeholder="Oktató, téma, vázlat, kitöltő...">
  </div>

  <div class="table-wrapper">
    <table class="entries-table">
      <thead>
        <tr>
          <th><button type="button" data-sort="date">Dátum</button></th>
          <th><button type="button" data-sort="hour">Óra</button></th>
          <th><button type="button" data-sort="shift">Műszak</button></th>
          <th><button type="button" data-sort="education_type">Oktatás típusa</button></th>
          <th><button type="button" data-sort="duration">Időtartam</button></th>
          <th><button type="button" data-sort="instructor">Oktató</button></th>
          <th><button type="button" data-sort="topic">Téma</button></th>
          <th><button type="button" data-sort="outline">Vázlat</button></th>
          <th><button type="button" data-sort="user">Kitöltötte</button></th>
        </tr>
      </thead>
      <tbody id="entriesTableBody"></tbody>
    </table>
  </div>

  <p id="tableMessage"></p>

  <script src="table-view.js"></script>
</body>

</html>
