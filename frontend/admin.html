<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <title>Admin - Lista bővítés</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <a href="index.html"><button type="button">Vissza a naplóhoz</button></a>
  <button onclick="logout()">Kijelentkezés</button>

  <h1>Admin - Legördülő listák bővítése</h1>

  <form id="form-instructor">
    <h3>Új oktató hozzáadása</h3>
    <input type="text" id="instructorName" placeholder="Pl. Dr. Kovács Béla" required>
    <button type="submit">Mentés</button>
    <p id="instructorMessage"></p>
  </form>

  <form id="form-education-type">
    <h3>Új oktatási típus hozzáadása</h3>
    <input type="text" id="educationTypeName" placeholder="Pl. Időszakos oktatás" required>
    <button type="submit">Mentés</button>
    <p id="educationTypeMessage"></p>
  </form>

  <form id="form-topic">
    <h3>Új téma hozzáadása</h3>
    <input type="text" id="topicName" placeholder="Pl. Algoritmusok" required>
    <button type="submit">Mentés</button>
    <p id="topicMessage"></p>
  </form>

  <form id="form-outline">
    <h3>Új vázlat hozzáadása</h3>
    <input type="text" id="outlineContent" placeholder="Pl. DFS, BFS gráfbejárás" required>
    <button type="submit">Mentés</button>
    <p id="outlineMessage"></p>
  </form>

  <form id="form-duration">
    <h3>Új időtartam hozzáadása</h3>
    <input type="text" id="durationValue" placeholder="Pl. 45 perc" required>
    <button type="submit">Mentés</button>
    <p id="durationMessage"></p>
  </form>

  <hr>

  <h2>Oktatók listája</h2>
  <div id="instructorList"></div>

  <h2>Oktatási típusok listája</h2>
  <div id="educationTypeList"></div>

  <h2>Témák listája</h2>
  <div id="topicList"></div>

  <h2>Vázlatok listája</h2>
  <div id="outlineList"></div>

  <h2>Időtartamok listája</h2>
  <div id="durationList"></div>

  <script src="admin.js"></script>
</body>

</html>
