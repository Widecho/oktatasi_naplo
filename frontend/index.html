<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <title>Oktatási Napló</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>Új naplóbejegyzés</h1>

  <form id="entryForm">
    <input type="date" id="date" required>

    <input type="text" id="hourText" list="hoursList" placeholder="Óra, pl. 08:00" required>
    <datalist id="hoursList"></datalist>
    <select id="education_types" required></select>
    <select id="shift" style="display:none;">
      <option value="" disabled selected>Válassz műszakot!</option>
      <option value="1">1. műszak</option>
      <option value="2">2. műszak</option>
      <option value="3">3. műszak</option>
      <option value="4">4. műszak</option>
      <option value="5">5. műszak</option>
      <option value="kombinált">Kombinált (mindenkire vonatkozik)</option>
    </select>
    <select id="durations" required></select>
    <select id="instructors" required></select>
    <select id="topics" required></select>
    <select id="outlines" required></select>

    <button type="submit">Mentés</button>
    <button type="button" id="cancelEdit" style="display: none;">Mégse szerkesztés</button>
  </form>

  <hr>
  <button onclick="logout()" style="float: right;">Kijelentkezés</button>

  <h2>Szűrés és exportálás</h2>

  <div class="filter-section">
    <label for="filterType"><strong>Szűrés típusa:</strong></label>
    <select id="filterType" onchange="updateFilterUI()">
      <option value="month">Havi bontás</option>
      <option value="day">Napi bontás</option>
      <option value="interval">Időszak</option>
    </select>

    <span id="monthFilterContainer">
      <label for="monthSelect"><strong>Hónap:</strong></label>
      <select id="monthSelect"></select>
    </span>

    <span id="dayFilterContainer" style="display: none;">
      <label for="daySelect"><strong>Nap:</strong></label>
      <input type="date" id="daySelect">
    </span>

    <span id="intervalFilterContainer" style="display: none;">
      <label for="startDate"><strong>Kezdő dátum:</strong></label>
      <input type="date" id="startDate">
      <label for="endDate"><strong>Záró dátum:</strong></label>
      <input type="date" id="endDate">
    </span>

    <span id="shiftFilterContainer" style="display: none;">
      <label for="filterShift"><strong>Műszak szűrés:</strong></label>
      <select id="filterShift">
        <option value="Összes">Összes</option>
        <option value="1">1. műszak</option>
        <option value="2">2. műszak</option>
        <option value="3">3. műszak</option>
        <option value="4">4. műszak</option>
        <option value="5">5. műszak</option>
        <option value="kombinált">Kombinált</option>
      </select>
    </span>

    <button onclick="loadEntries()">Megjelenítés</button>
    <button onclick="openTableView()">Táblázatos nézet</button>
    <button onclick="exportToExcel()">XLS export</button>
  </div>

  <h2>Naplóbejegyzések</h2>

  <div id="entryList" class="calendar-view"></div>

  <p id="response"></p>

  <script src="script.js"></script>
</body>

</html>
