<!DOCTYPE html>
<html lang="hu">

<head>
  <meta charset="UTF-8">
  <title>Bejelentkezés</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="page-actions">
    <a href="manual.html"><button type="button">Felhasználói kézikönyv</button></a>
  </div>

  <h1>Bejelentkezés</h1>
  <form id="loginForm">
    <input type="text" id="username" placeholder="Felhasználónév" required>
    <input type="password" id="password" placeholder="Jelszó" required>
    <button type="submit">Bejelentkezés</button>
  </form>
  <p id="error" style="color:red;"></p>

  <div id="changePasswordModal" class="password-modal" style="display:none;">
    <h2>Kötelező jelszóváltoztatás</h2>
    <p>Az adminisztrátor visszaállította a jelszavadat. Kérjük, adj meg egy új jelszót, amely legalább 6 karakterből áll és tartalmaz számot.</p>
    <form id="changePasswordForm">
      <input type="password" id="newPassword" placeholder="Új jelszó" required>
      <button type="submit">Jelszó frissítése és továbblépés</button>
    </form>
    <p id="changePasswordError" style="color:red;"></p>
  </div>
  <p>Nincs még fiókod? <a href="register.html">Regisztrálj itt!</a></p>

  <script src="script.js"></script>
</body>

</html>
